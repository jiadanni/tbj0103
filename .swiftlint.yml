included:
  - Sources
  - Tests

excluded:
  - .build
  - tauri

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo
  - trailing_whitespace

line_length:
  warning: 130
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - to
    - at
    - db

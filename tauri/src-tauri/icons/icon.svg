<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8B7CF6"/>
      <stop offset="45%"  stop-color="#6D5AE6"/>
      <stop offset="100%" stop-color="#4C3BC4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2A1C6B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- squircle plate -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <g filter="url(#drop)">
    <!-- outer hexagon ring -->
    <polygon points="512,236 751,374 751,650 512,788 273,650 273,374"
             fill="none" stroke="#ffffff" stroke-opacity="0.62"
             stroke-width="26" stroke-linejoin="round"/>
    <!-- spokes -->
    <g stroke="#ffffff" stroke-opacity="0.62" stroke-width="26" stroke-linecap="round">
      <line x1="512" y1="512" x2="512" y2="236"/>
      <line x1="512" y1="512" x2="751" y2="374"/>
      <line x1="512" y1="512" x2="751" y2="650"/>
      <line x1="512" y1="512" x2="512" y2="788"/>
      <line x1="512" y1="512" x2="273" y2="650"/>
      <line x1="512" y1="512" x2="273" y2="374"/>
    </g>

    <!-- core glow + node -->
    <circle cx="512" cy="512" r="190" fill="url(#coreGlow)"/>
    <circle cx="512" cy="512" r="86" fill="#ffffff"/>

    <!-- outer nodes -->
    <g fill="#ffffff">
      <circle cx="512" cy="236" r="58"/>
      <circle cx="751" cy="374" r="58"/>
      <circle cx="751" cy="650" r="58"/>
      <circle cx="512" cy="788" r="58"/>
      <circle cx="273" cy="650" r="58"/>
      <circle cx="273" cy="374" r="58"/>
    </g>
  </g>
</svg>

[package]
name = "aetherium"
version = "0.1.0"
edition = "2021"
default-run = "aetherium"

[lib]
name = "aetherium_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

rayon = "1.10"
ndarray = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "1"
anyhow = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["time"] }
bytes = "1"
lopdf = "0.34"
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
dirs = "5.0"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sysinfo = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"], optional = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Base CPU-only build — no GPU backend baked in.
llama-cpp-2 = { version = "0.1", optional = true }
# Per-backend aliases: GPU features are declared here (inside the Linux stanza)
# so that activating llamacpp-cuda/rocm/vulkan on macOS is a no-op rather than
# adding an incompatible GPU sub-feature to the macOS dep.
llama-cpp-2-cuda-backend   = { package = "llama-cpp-2", version = "0.1", features = ["cuda"],   optional = true }
llama-cpp-2-rocm-backend   = { package = "llama-cpp-2", version = "0.1", features = ["rocm"],   optional = true }
llama-cpp-2-vulkan-backend = { package = "llama-cpp-2", version = "0.1", features = ["vulkan"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Base CPU-only build for Windows.
llama-cpp-2 = { version = "0.1", optional = true }
# CUDA (NVIDIA) and Vulkan (AMD/Intel via WDDM) are the supported backends on
# Windows. ROCm is Linux-only; AMD users on Windows should use llamacpp-vulkan.
llama-cpp-2-cuda-backend   = { package = "llama-cpp-2", version = "0.1", features = ["cuda"],   optional = true }
llama-cpp-2-vulkan-backend = { package = "llama-cpp-2", version = "0.1", features = ["vulkan"], optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
llamacpp        = ["dep:llama-cpp-2"]
llamacpp-cuda   = ["llamacpp", "dep:llama-cpp-2-cuda-backend"]   # NVIDIA
llamacpp-rocm   = ["llamacpp", "dep:llama-cpp-2-rocm-backend"]   # AMD
llamacpp-vulkan = ["llamacpp", "dep:llama-cpp-2-vulkan-backend"]  # Intel / any Vulkan GPU

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 0

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

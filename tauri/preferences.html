<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferences — Aetherium</title>
    <style>
      /* Theme bg defaults — overridden inline below from persisted settings */
      :root { --__boot-bg: #ffffff; --__boot-fg: #1a1a1a; --__boot-accent: #007AFF; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--__boot-bg); color: var(--__boot-fg); }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
      #__boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; background: var(--__boot-bg); color: var(--__boot-fg);
        font-size: 13px; opacity: 1; transition: opacity 180ms ease;
      }
      #__boot-splash .__boot-ring {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--__boot-fg) 18%, transparent);
        border-top-color: var(--__boot-accent);
        animation: __boot-spin 0.8s linear infinite;
      }
      #__boot-splash .__boot-label { opacity: 0.6; }
      @keyframes __boot-spin { to { transform: rotate(360deg); } }
      .__boot-hidden { opacity: 0 !important; pointer-events: none; }
    </style>
    <script>
      // Read persisted theme/accent so the splash matches the user's chosen theme,
      // avoiding a white flash while the React bundle initializes.
      (function () {
        try {
          var raw = localStorage.getItem("aetherium-settings");
          if (!raw) { return; }
          var parsed = JSON.parse(raw);
          var s = (parsed && parsed.state) ? parsed.state : parsed;
          var theme = (s && s.theme) || "system";
          var accent = (s && s.accentColor) || "#007AFF";
          var bg = "#ffffff", fg = "#1a1a1a";
          if (theme === "system") {
            var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (dark) { bg = "#18181b"; fg = "#f4f4f5"; }
          } else if (theme === "dark") { bg = "#18181b"; fg = "#f4f4f5"; }
          else if (theme === "sepia") { bg = "#f4ecd8"; fg = "#2a1810"; }
          else if (theme === "hacker") { bg = "#0a0f0a"; fg = "#00ff41"; }
          else if (theme === "noir") { bg = "#0e0e0e"; fg = "#f8f9fa"; }
          var root = document.documentElement.style;
          root.setProperty("--__boot-bg", bg);
          root.setProperty("--__boot-fg", fg);
          root.setProperty("--__boot-accent", accent);
        } catch (_) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="__boot-splash" aria-hidden="true">
      <div class="__boot-ring"></div>
      <div class="__boot-label">Loading preferences…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/preferences/main.tsx"></script>
  </body>
</html>
